<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة طلبات PMC</title><style>
*{box-sizing:border-box}body{margin:0;background:#081321;color:#f4f7fb;font:16px/1.8 Tajawal,Arial,sans-serif;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#101f33;border:1px solid #263c56;border-radius:18px;padding:22px;margin:16px 0}input,select,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #456078;background:#0b1929;color:white}input{display:block;width:100%;margin:10px 0}button{cursor:pointer;background:#D7263D;border:0;margin:4px}.muted{color:#a9b7c8}.hidden{display:none}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.item{border-top:1px solid #263c56;padding:16px 0}.tag{color:#8ec9e8}.danger{background:#812033}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.item p{margin:4px 0;overflow-wrap:anywhere}</style></head><body><main class="wrap"><h1>لوحة إدارة مجتمع السيطرة المهنية</h1><p class="muted">لوحة خاصة بالإدارة — بيانات المتقدمين لا تُعرض للعامة.</p>
<section id="login" class="card"><h2>تسجيل الدخول</h2><form id="loginForm"><input id="email" type="email" placeholder="البريد الإداري" required autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" required autocomplete="current-password"><button>دخول</button></form><p id="loginMsg"></p></section>
<section id="panel" class="hidden"><div class="row"><h2>الطلبات الواردة</h2><button id="refresh">تحديث</button><button id="logout" class="danger">تسجيل الخروج</button></div><div class="row"><strong id="count">0 طلب</strong><select id="filter"><option value="">كل الطلبات</option><option value="program">برنامج السيطرة المهنية</option><option value="workshop">الورشة</option></select></div><div id="list" class="card"></div></section></main>
<script>
const $=id=>document.getElementById(id);const labels={new:'جديد',reviewed:'تمت المراجعة',pending:'قيد المتابعة',closed:'مغلق'};let rows=[];
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});if(r.status===401){$('panel').classList.add('hidden');$('login').classList.remove('hidden');throw Error('انتهت الجلسة، سجّل الدخول مجدداً');}const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'حدث خطأ');return d;}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='جارٍ التحقق...';try{await api('/api/login',{method:'POST',body:JSON.stringify({email:$('email').value,password:$('password').value})});$('login').classList.add('hidden');$('panel').classList.remove('hidden');load();}catch(x){$('loginMsg').textContent=x.message;}};
async function load(){try{rows=(await api('/api/admin/applications')).applications;render();}catch(e){$('list').textContent=e.message;}}
function render(){const f=$('filter').value;const data=rows.filter(x=>!f||x.type===f);$('count').textContent=data.length+' طلب';$('list').innerHTML=data.map(x=>'<article class="item"><div class="row"><b>#'+x.id+' — '+(x.type==='program'?'برنامج السيطرة المهنية':'ورشة المسار المهني')+'</b><span class="tag">'+new Date(x.created_at).toLocaleString('ar-SA')+'</span></div><div class="grid"><p><b>الاسم:</b> '+esc(x.name)+'</p><p><b>الجوال:</b> '+esc(x.phone)+'</p><p><b>البريد:</b> '+esc(x.email)+'</p><p><b>التخصص الصحي:</b> '+esc(x.field)+'</p><p><b>المسار:</b> '+esc(x.path)+'</p><p><b>الحضور:</b> '+esc(x.attendance)+'</p><p><b>الهدف:</b> '+esc(x.goal)+'</p><p><b>رمز الدعوة:</b> '+esc(x.invite_code)+'</p></div><div class="row"><select data-status="'+x.id+'">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+(x.status===k?'selected':'')+'>'+v+'</option>').join('')+'</select><button data-save="'+x.id+'">حفظ الحالة</button><button class="danger" data-delete="'+x.id+'">حذف نهائي</button></div></article>').join('')||'<p>لا توجد طلبات حالياً.</p>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const id=b.dataset.save;await api('/api/admin/applications/'+id,{method:'PATCH',body:JSON.stringify({status:document.querySelector('[data-status="'+id+'"]').value})});load();});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('تأكيد حذف الطلب نهائياً؟'))return;await api('/api/admin/applications/'+b.dataset.delete,{method:'DELETE'});load();});}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('refresh').onclick=load;$('filter').onchange=render;$('logout').onclick=async()=>{await api('/api/logout',{method:'POST'});$('panel').classList.add('hidden');$('login').classList.remove('hidden');};</script></body></html>
